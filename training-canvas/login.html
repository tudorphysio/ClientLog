<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Coach Journal Login</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#faf9f6;color:#36312b;font-family:Georgia,serif}main{width:min(400px,calc(100% - 40px));padding:32px;background:#fffdf8;border:1px solid #e8dbc4;border-radius:14px;box-shadow:0 15px 35px #392c1814}h1{font-weight:400}label{display:block;margin:24px 0 7px;font-size:14px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cab992;border-radius:8px;font-size:18px}button{margin-top:15px;padding:13px;background:#a88e5d;color:#fff;border:0;border-radius:8px;width:100%;font-size:16px;cursor:pointer}small{color:#8d7b5b}p{color:#9c3434;min-height:18px}</style></head><body><main><small>PRIVATE WORKSPACE</small><h1>Coach Journal</h1><form id="form"><label for="password">Your password</label><input type="password" id="password" autocomplete="current-password" required autofocus><button>Open journal</button><p id="error" role="alert"></p></form></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok){const next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/oauth/authorize?')?next:'/';return}document.getElementById('error').textContent=(await r.json()).error||'Login failed'}catch(_){document.getElementById('error').textContent='Cannot connect'}finally{button.disabled=false}}</script></body></html>
