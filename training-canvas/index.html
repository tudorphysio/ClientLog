<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Training Canvas</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e7e9f0;background:#11131b}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:66px;display:flex;align-items:center;gap:10px;padding:11px 17px;background:#1a1d28;border-bottom:1px solid #333748;position:relative;z-index:5}.brand{font-weight:800;letter-spacing:-.5px;margin-right:auto}.brand small{color:#a2a9c0;font-weight:500;margin-left:10px}.btn{background:#2a3041;border:1px solid #464d63;color:#f1f3fc;border-radius:9px;padding:9px 12px}.btn:hover{background:#38405a}.primary{background:#e9bc66;color:#171920;border-color:#e9bc66;font-weight:700}.primary:hover{background:#f9d48b}.workspace{height:calc(100dvh - 66px);position:relative;overflow:hidden;cursor:grab;background-color:#11131b;background-image:radial-gradient(#303544 1px,transparent 1px);background-size:24px 24px;touch-action:none}.workspace.panning{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0}.lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}.card{width:290px;min-height:155px;position:absolute;border-radius:14px;background:#262e3c;border:1px solid #526078;box-shadow:0 10px 30px #0005;display:flex;flex-direction:column;overflow:hidden;cursor:default;touch-action:none}.card.training{border-top:5px solid #8aabdc}.card.goal{border-top:5px solid #f1c46c}.card.habit{border-top:5px solid #8cc6a0}.card.milestone{border-top:5px solid #b69de7}.card-head{padding:12px 12px 8px;display:flex;gap:6px;align-items:center;cursor:grab;touch-action:none}.card-head:active{cursor:grabbing}.card-title{min-width:0;flex:1;background:none;color:#fff;border:0;font-size:16px;font-weight:700;outline:none}.date{margin:0 12px 6px;color:#aab4c6;font-size:12px}.note{background:#1f2632;color:#e5e9f4;border:1px solid #404a60;border-radius:9px;margin:6px 12px 12px;padding:10px;resize:vertical;min-height:100px;line-height:1.5;white-space:pre-wrap;outline:none}.note:focus{border-color:#e3b763}.tiny{padding:4px 7px;border-radius:6px;background:transparent;color:#b5bbca;border:0}.tiny:hover{background:#384354;color:white}.tool{position:absolute;left:16px;bottom:18px;z-index:4;background:#1c2230;border:1px solid #414b60;border-radius:12px;padding:8px 12px;color:#b9c3d4;font-size:12px;max-width:calc(100% - 32px)}.status{position:absolute;right:16px;bottom:18px;z-index:4;background:#1c2230;border:1px solid #414b60;border-radius:12px;padding:8px;font-size:12px}.empty{position:absolute;top:25%;left:50%;transform:translateX(-50%);color:#b7c0d0;text-align:center;pointer-events:none}.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0009;z-index:10;padding:16px}.modal.open{display:flex}.dialog{width:min(400px,100%);background:#252b3a;border:1px solid #535d75;border-radius:15px;padding:20px}.dialog h2{margin:0 0 15px}.dialog label{display:block;margin:10px 0 5px;color:#b9c3d4;font-size:13px}.dialog input,.dialog select{width:100%;border-radius:8px;padding:10px;background:#181e29;border:1px solid #576177;color:#fff}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}@media(max-width:700px){.top{height:auto;min-height:66px;flex-wrap:wrap;padding:8px}.brand{width:100%;margin:0}.brand small{display:none}.btn{padding:7px 9px;font-size:12px}.workspace{height:calc(100dvh - 98px)}.tool{font-size:11px}}
</style></head><body>
<header class="top"><div class="brand">Training Canvas <small>Flexible workout notes</small></div><button class="btn primary" id="add">+ New card</button><button class="btn" id="connect">Connect cards</button><button class="btn" id="fit">Fit cards</button><button class="btn" id="export">Export</button><button class="btn" id="import">Import</button><input type="file" id="file" accept="application/json" hidden></header>
<main id="viewport" class="workspace" aria-label="Training canvas"><div id="world" class="world"><svg id="lines" class="lines"></svg><div id="cards"></div></div><div id="empty" class="empty">Add a daily card and write anything.<br>Exercises, feelings, progress, reminders — no fixed fields.</div><div class="tool" id="hint">Drag card headers to move · Drag empty space to pan · Wheel/pinch to zoom</div><div class="status"><span id="zoom">100%</span> · <span id="saved">Saved locally</span></div></main>
<div class="modal" id="modal"><div class="dialog"><h2>New card</h2><label for="title">Title</label><input id="title" placeholder="e.g. Friday training" maxlength="100"><label for="type">Color / type</label><select id="type"><option value="training">Training · blue</option><option value="goal">Goal · gold</option><option value="habit">Habit · green</option><option value="milestone">Milestone · purple</option></select><label for="date">Date (optional)</label><input id="date" type="date"><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="create">Create card</button></div></div></div>
<script>
(()=>{
'use strict';
const KEY='training-canvas-v1';
const viewport=document.getElementById('viewport'),world=document.getElementById('world'),cardsEl=document.getElementById('cards'),lines=document.getElementById('lines');
let state={cards:[],edges:[],panX:100,panY:85,scale:1};
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&Array.isArray(raw.cards)&&Array.isArray(raw.edges))state={...state,...raw};}catch(_){}
state.cards=state.cards.filter(c=>c&&typeof c.id==='string');state.edges=state.edges.filter(e=>Array.isArray(e)&&e.length===2);
let saving,gesture=null,connectFrom=null,connectMode=false;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const persist=()=>{clearTimeout(saving);document.getElementById('saved').textContent='Saving…';saving=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saved').textContent='Saved locally';}catch(e){document.getElementById('saved').textContent='Storage full — export backup';}},250);};
const updateView=()=>{world.style.transform='translate('+state.panX+'px,'+state.panY+'px) scale('+state.scale+')';viewport.style.backgroundPosition=state.panX+'px '+state.panY+'px';viewport.style.backgroundSize=(24*state.scale)+'px '+(24*state.scale)+'px';document.getElementById('zoom').textContent=Math.round(state.scale*100)+'%';};
const position=(e)=>({x:(e.clientX-viewport.getBoundingClientRect().left-state.panX)/state.scale,y:(e.clientY-viewport.getBoundingClientRect().top-state.panY)/state.scale});
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'card-'+Date.now()+'-'+Math.random().toString(16).slice(2);
function redrawLines(){lines.replaceChildren();for(const [a,b] of state.edges){const from=state.cards.find(c=>c.id===a),to=state.cards.find(c=>c.id===b);if(!from||!to)continue;const x1=from.x+145,y1=from.y+85,x2=to.x+145,y2=to.y+85;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+x1+' '+y1+' C '+(x1+x2)/2+' '+y1+', '+(x1+x2)/2+' '+y2+', '+x2+' '+y2);p.setAttribute('fill','none');p.setAttribute('stroke','#8b95ae');p.setAttribute('stroke-width','2.5');lines.append(p);}}
function render(){cardsEl.replaceChildren();document.getElementById('empty').hidden=state.cards.length>0;
for(const c of state.cards){const card=document.createElement('article');card.className='card '+( ['training','goal','habit','milestone'].includes(c.type)?c.type:'training');card.style.left=c.x+'px';card.style.top=c.y+'px';card.dataset.id=c.id;
const header=document.createElement('div');header.className='card-head';const title=document.createElement('input');title.className='card-title';title.value=c.title||'';title.setAttribute('aria-label','Card title');title.addEventListener('input',()=>{c.title=title.value;persist();});
const link=document.createElement('button');link.className='tiny';link.textContent='↗';link.title='Connect this card';link.addEventListener('click',()=>selectConnection(c.id));
const remove=document.createElement('button');remove.className='tiny';remove.textContent='×';remove.title='Delete card';remove.addEventListener('click',()=>{if(!confirm('Delete this card?'))return;state.cards=state.cards.filter(x=>x.id!==c.id);state.edges=state.edges.filter(e=>!e.includes(c.id));render();persist();});
header.append(title,link,remove);header.addEventListener('pointerdown',e=>{if(e.target!==header)return;e.preventDefault();e.stopPropagation();header.setPointerCapture(e.pointerId);gesture={kind:'card',id:c.id,x:e.clientX,y:e.clientY,origX:c.x,origY:c.y};});
const date=document.createElement('div');date.className='date';date.textContent=c.date||'Undated · free-form note';
const note=document.createElement('textarea');note.className='note';note.placeholder='Write anything here…\n\nSquat 60 × 8\nFelt strong today\nNext time: add mobility';note.value=c.note||'';note.addEventListener('input',()=>{c.note=note.value;persist();});note.addEventListener('pointerdown',e=>e.stopPropagation());
card.append(header,date,note);cardsEl.append(card);}redrawLines();updateView();}
function selectConnection(id){if(!connectFrom){connectFrom=id;document.getElementById('hint').textContent='Select ↗ on the second card to connect it';return;}if(connectFrom!==id&&!state.edges.some(e=>e[0]===connectFrom&&e[1]===id)){state.edges.push([connectFrom,id]);persist();}connectFrom=null;document.getElementById('hint').textContent='Drag card headers · Drag background to pan · Wheel/pinch to zoom';redrawLines();}
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.card')||e.target.closest('.tool')||e.target.closest('.status'))return;viewport.setPointerCapture(e.pointerId);gesture={kind:'pan',x:e.clientX,y:e.clientY,origX:state.panX,origY:state.panY};viewport.classList.add('panning');});
window.addEventListener('pointermove',e=>{if(!gesture)return;if(gesture.kind==='pan'){state.panX=gesture.origX+e.clientX-gesture.x;state.panY=gesture.origY+e.clientY-gesture.y;updateView();}else if(gesture.kind==='card'){const c=state.cards.find(c=>c.id===gesture.id);if(!c)return;c.x=Math.round(gesture.origX+(e.clientX-gesture.x)/state.scale);c.y=Math.round(gesture.origY+(e.clientY-gesture.y)/state.scale);const el=[...cardsEl.children].find(el=>el.dataset.id===c.id);if(el){el.style.left=c.x+'px';el.style.top=c.y+'px';}redrawLines();}});
window.addEventListener('pointerup',()=>{if(gesture)persist();gesture=null;viewport.classList.remove('panning');});
viewport.addEventListener('wheel',e=>{if(e.target.closest('textarea'))return;e.preventDefault();const old=state.scale,newScale=clamp(old*Math.exp(-e.deltaY*.001),.3,2.5),r=viewport.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;state.panX=x-(x-state.panX)*newScale/old;state.panY=y-(y-state.panY)*newScale/old;state.scale=newScale;updateView();persist();},{passive:false});
document.getElementById('add').onclick=()=>{document.getElementById('modal').classList.add('open');document.getElementById('title').value='';document.getElementById('date').value=new Date().toLocaleDateString('en-CA');document.getElementById('title').focus();};
document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('create').onclick=()=>{const p=position({clientX:viewport.getBoundingClientRect().left+viewport.clientWidth/2-145*state.scale,clientY:viewport.getBoundingClientRect().top+viewport.clientHeight/2-70*state.scale});state.cards.push({id:uid(),x:Math.round(p.x+state.cards.length%5*20),y:Math.round(p.y+state.cards.length%5*20),title:document.getElementById('title').value||'Training note',type:document.getElementById('type').value,date:document.getElementById('date').value,note:''});document.getElementById('modal').classList.remove('open');render();persist();};
document.getElementById('connect').onclick=()=>{connectFrom=null;document.getElementById('hint').textContent='Click ↗ on the first card, then ↗ on the second card';};
document.getElementById('fit').onclick=()=>{if(!state.cards.length)return;const minX=Math.min(...state.cards.map(c=>c.x)),minY=Math.min(...state.cards.map(c=>c.y)),maxX=Math.max(...state.cards.map(c=>c.x+300)),maxY=Math.max(...state.cards.map(c=>c.y+250));state.scale=clamp(Math.min((viewport.clientWidth-70)/(maxX-minX),(viewport.clientHeight-70)/(maxY-minY)),.3,1.5);state.panX=(viewport.clientWidth-(maxX-minX)*state.scale)/2-minX*state.scale;state.panY=(viewport.clientHeight-(maxY-minY)*state.scale)/2-minY*state.scale;updateView();persist();};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='training-canvas-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
document.getElementById('import').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.cards)||!Array.isArray(obj.edges))throw Error('Invalid canvas backup');if(!confirm('Replace the current canvas with this imported backup?'))return;state={cards:obj.cards,edges:obj.edges,panX:Number(obj.panX)||100,panY:Number(obj.panY)||85,scale:clamp(Number(obj.scale)||1,.3,2.5)};render();persist();}catch(err){alert('Could not import: '+err.message);}e.target.value='';};
render();
})();
</script></body></html>
